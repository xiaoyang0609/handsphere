<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星穹流光 · Stellar Stream</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; position: fixed; top: 0; left: 0; }
#ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
#ui-layer > * { pointer-events: auto; }

/* ── 开始 / 结束 界面 ── */
.screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 20; transition: opacity 0.8s ease, transform 0.8s ease;
  pointer-events: none; opacity: 0; transform: scale(0.95);
  background: radial-gradient(ellipse at center, rgba(10,5,30,0.85) 0%, rgba(0,0,0,0.95) 100%);
}
.screen.active { pointer-events: auto; opacity: 1; transform: scale(1); }
.screen.hidden { pointer-events: none; opacity: 0; transform: scale(1.1); }

.screen h1 {
  font-size: clamp(2.4rem, 8vw, 5rem);
  font-weight: 300;
  background: linear-gradient(135deg, #ff6b9d, #c44dff, #60efff, #ffd93d);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 4s ease infinite;
  letter-spacing: 0.15em;
  margin-bottom: 0.2em;
  text-shadow: none;
  filter: drop-shadow(0 0 40px rgba(100,80,255,0.3));
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.screen .subtitle {
  font-size: clamp(0.8rem, 2vw, 1.2rem);
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.5em;
  margin-bottom: 2rem;
  font-weight: 300;
}
.screen .score-display {
  font-size: clamp(1rem, 3vw, 1.8rem);
  color: rgba(255,255,255,0.7);
  margin: 0.3rem 0;
  font-weight: 300;
  letter-spacing: 0.05em;
}
.screen .score-display span {
  color: #ffd93d;
  font-weight: 600;
  font-size: 1.2em;
}
.screen .score-display .high { color: #60efff; }

.btn {
  padding: 14px 48px;
  margin-top: 1.5rem;
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 50px;
  background: rgba(255,255,255,0.06);
  color: #fff;
  font-size: clamp(1rem, 2vw, 1.2rem);
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.4s ease;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
}
.btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.4);
  transform: translateY(-2px);
  box-shadow: 0 8px 40px rgba(100,80,255,0.3);
}
.btn:active { transform: scale(0.96); }
.btn .shine {
  position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
  animation: btnShine 6s ease infinite;
}
@keyframes btnShine {
  0%, 100% { transform: translate(-30%, -30%) rotate(0deg); }
  50% { transform: translate(30%, 30%) rotate(180deg); }
}

/* ── 游戏 HUD ── */
#hud {
  position: fixed; top: 0; left: 0; width: 100%; padding: 18px 24px;
  display: flex; justify-content: space-between; align-items: flex-start;
  z-index: 15; opacity: 0; transition: opacity 0.6s ease;
  pointer-events: none;
}
#hud.show { opacity: 1; }
#hud .hud-score {
  font-size: clamp(1.2rem, 3vw, 2rem);
  color: rgba(255,255,255,0.9);
  font-weight: 300;
  letter-spacing: 0.05em;
  text-shadow: 0 0 30px rgba(100,80,255,0.3);
}
#hud .hud-score span { font-weight: 700; color: #ffd93d; }
#hud .hud-high {
  font-size: clamp(0.7rem, 1.5vw, 0.9rem);
  color: rgba(255,255,255,0.4);
  text-align: right;
}
#hud .hud-high span { color: #60efff; }
#powerup-indicator {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  z-index: 15; opacity: 0; transition: opacity 0.4s ease;
  pointer-events: none;
  font-size: clamp(0.8rem, 1.5vw, 1rem);
  color: #ffd700;
  letter-spacing: 0.1em;
  text-shadow: 0 0 20px rgba(255,215,0,0.4);
}

/* ── 控制提示 ── */
#controls-hint {
  position: fixed; bottom: 24%; left: 50%; transform: translateX(-50%);
  z-index: 14; opacity: 0; transition: opacity 1s ease;
  text-align: center;
  color: rgba(255,255,255,0.25);
  font-size: clamp(0.7rem, 1.2vw, 0.85rem);
  letter-spacing: 0.15em;
  font-weight: 300;
}
#controls-hint.show { opacity: 1; }
#controls-hint .icon { font-size: 1.5em; display: block; margin-bottom: 8px; }

/* ── 移动端适配 ── */
@media (max-width: 600px) {
  .btn { padding: 12px 32px; margin-top: 1rem; }
  #hud { padding: 12px 16px; }
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-score">✦ <span id="scoreDisplay">0</span></div>
  <div class="hud-high">最高 <span id="highDisplay">0</span></div>
</div>
<div id="powerup-indicator">⚡ 磁力吸引</div>
<div id="controls-hint"><span class="icon">🖱</span>移动鼠标 · 收集流光 · 避开暗影</div>

<!-- 开始界面 -->
<div class="screen active" id="menuScreen">
  <h1>星穹流光</h1>
  <div class="subtitle">✦ S T E L L A R &nbsp; S T R E A M ✦</div>
  <div class="score-display">最高 <span class="high" id="menuHigh">0</span></div>
  <button class="btn" id="startBtn"><span class="shine"></span>开始遨游</button>
</div>

<!-- 结束界面 -->
<div class="screen hidden" id="gameoverScreen">
  <h1>流光陨落</h1>
  <div class="subtitle">✦ G A M E &nbsp; O V E R ✦</div>
  <div class="score-display">得分 <span id="finalScore">0</span></div>
  <div class="score-display">最高 <span class="high" id="finalHigh">0</span></div>
  <button class="btn" id="restartBtn"><span class="shine"></span>再次遨游</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  星穹流光 · Stellar Stream
//  完整游戏引擎 — 单文件
// ═══════════════════════════════════════════════════════════════

"use strict";

// ── Canvas 设置 ──
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── DOM 引用 ──
const hudEl = document.getElementById('hud');
const scoreDisplay = document.getElementById('scoreDisplay');
const highDisplay = document.getElementById('highDisplay');
const powerupIndicator = document.getElementById('powerup-indicator');
const controlsHint = document.getElementById('controls-hint');
const menuScreen = document.getElementById('menuScreen');
const gameoverScreen = document.getElementById('gameoverScreen');
const menuHigh = document.getElementById('menuHigh');
const finalScore = document.getElementById('finalScore');
const finalHigh = document.getElementById('finalHigh');

// ── Web Audio ──
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, duration, type = 'sine', vol = 0.12) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playCollect(pitch = 880) {
  playTone(pitch, 0.15, 'sine', 0.1);
  playTone(pitch * 1.5, 0.1, 'sine', 0.05);
}
function playPowerUp() {
  playTone(660, 0.1, 'sine', 0.1);
  setTimeout(() => playTone(880, 0.1, 'sine', 0.1), 100);
  setTimeout(() => playTone(1100, 0.15, 'sine', 0.1), 200);
}
function playHit() {
  playTone(200, 0.3, 'sawtooth', 0.08);
  playTone(100, 0.5, 'square', 0.05);
}
function playGameOver() {
  [440, 370, 330, 260].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.35, 'sine', 0.08), i * 150);
  });
}

// ── 工具函数 ──
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function hsl(h, s, l) { return `hsl(${h}, ${s}%, ${l}%)`; }

// ── 输入 ──
const input = { x: W / 2, y: H / 2, active: false };

canvas.addEventListener('mousemove', e => {
  input.x = e.clientX;
  input.y = e.clientY;
  input.active = true;
});
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  input.x = t.clientX;
  input.y = t.clientY;
  input.active = true;
  initAudio();
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  const t = e.touches[0];
  input.x = t.clientX;
  input.y = t.clientY;
  input.active = true;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => { input.active = false; });

// ── 星空 ──
class StarField {
  constructor(count = 220) {
    this.stars = [];
    for (let i = 0; i < count; i++) {
      this.stars.push(this.createStar());
    }
  }
  createStar() {
    return {
      x: rand(0, W), y: rand(0, H),
      size: rand(0.5, 2.8),
      speed: rand(0.1, 0.5),
      twinkleSpeed: rand(0.5, 3),
      twinklePhase: rand(0, Math.PI * 2),
      hue: rand(200, 320),
      brightness: rand(0.3, 1),
    };
  }
  update(dt, scrollY) {
    for (const s of this.stars) {
      s.twinklePhase += s.twinkleSpeed * dt;
      s.y += s.speed * dt * 30;
      if (s.y > H + 5) { s.y = -5; s.x = rand(0, W); }
    }
  }
  draw(ctx, alpha = 1) {
    for (const s of this.stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(s.twinklePhase);
      const a = clamp(s.brightness * twinkle * alpha, 0, 1);
      const size = s.size * (0.8 + 0.2 * twinkle);
      ctx.beginPath();
      ctx.arc(s.x, s.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${s.hue}, 80%, ${70 + 30 * twinkle}%, ${a})`;
      ctx.fill();
      // glow
      if (size > 1.5 && twinkle > 0.7) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, size * 4, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${s.hue}, 80%, 80%, ${a * 0.12})`;
        ctx.fill();
      }
    }
  }
}

// ── 极光 ──
class Aurora {
  constructor() {
    this.layers = [];
    for (let i = 0; i < 3; i++) {
      this.layers.push({
        offset: rand(0, Math.PI * 2),
        speed: rand(0.1, 0.25),
        amplitude: rand(80, 160),
        frequency: rand(0.003, 0.007),
        yBase: rand(0.1, 0.3),
        hue: [rand(140, 200), rand(220, 280), rand(290, 340)][i],
        alpha: rand(0.06, 0.12),
        width: rand(0.4, 0.7),
      });
    }
  }
  update(dt) {
    for (const l of this.layers) {
      l.offset += l.speed * dt;
    }
  }
  draw(ctx) {
    for (const l of this.layers) {
      const yBase = H * l.yBase;
      const amp = l.amplitude * (0.8 + 0.2 * Math.sin(l.offset * 0.5));
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 4) {
        const wave = Math.sin(x * l.frequency + l.offset) * amp
                   + Math.sin(x * l.frequency * 2.3 + l.offset * 1.7) * amp * 0.3
                   + Math.sin(x * l.frequency * 0.5 + l.offset * 0.7) * amp * 0.2;
        const y = yBase + wave;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, yBase - amp, 0, yBase + amp + 100);
      grad.addColorStop(0, `hsla(${l.hue}, 100%, 65%, 0)`);
      grad.addColorStop(0.3, `hsla(${l.hue + 20}, 100%, 70%, ${l.alpha})`);
      grad.addColorStop(0.6, `hsla(${l.hue - 20}, 100%, 55%, ${l.alpha * 0.7})`);
      grad.addColorStop(1, `hsla(${l.hue}, 100%, 40%, 0)`);
      ctx.fillStyle = grad;
      ctx.fill();
    }
  }
}

// ── 粒子系统 ──
const particles = [];

class Particle {
  constructor(x, y, color, size = 3, life = 1, speed = 60, type = 'spark') {
    this.x = x; this.y = y;
    const angle = rand(0, Math.PI * 2);
    this.vx = Math.cos(angle) * rand(speed * 0.3, speed);
    this.vy = Math.sin(angle) * rand(speed * 0.3, speed);
    this.size = rand(size * 0.5, size);
    this.life = rand(life * 0.5, life);
    this.maxLife = this.life;
    this.color = color;
    this.type = type;
    this.gravity = type === 'spark' ? 10 : -5;
    this.decay = type === 'trail' ? 3 : 1.2;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += this.gravity * dt;
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.life -= dt * this.decay;
    this.size *= 0.995;
  }
  get alive() { return this.life > 0; }
  draw(ctx) {
    const a = clamp(this.life / this.maxLife, 0, 1);
    const s = this.size * (0.3 + 0.7 * a);
    if (s < 0.3) return;
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    // glow
    if (s > 1.5) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, s * 3, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = a * 0.15;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function emitExplosion(x, y, color, count = 20, size = 4, speed = 100) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color, size, 0.8, speed, 'spark'));
  }
}

function emitTrail(x, y, color, count = 2) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(
      x + rand(-3, 3), y + rand(-3, 3), color, 2, 0.5, 20, 'trail'
    ));
  }
}

// ── 玩家 ──
class Player {
  constructor() {
    this.x = W / 2;
    this.y = H / 2;
    this.targetX = this.x;
    this.targetY = this.y;
    this.size = 18;
    this.speed = 0;
    this.maxSpeed = 480;
    this.angle = 0;
    this.trail = [];
    this.maxTrail = 14;
    this.glowIntensity = 0;
    this.shieldActive = false;
    this.shieldTimer = 0;
    this.magnetActive = false;
    this.magnetTimer = 0;
    this.invincible = false;
    this.invincibleTimer = 0;
    this.hue = 330;
  }
  reset() {
    this.x = W / 2; this.y = H / 2;
    this.targetX = this.x; this.targetY = this.y;
    this.speed = 0; this.angle = 0;
    this.trail = [];
    this.shieldActive = false;
    this.magnetActive = false;
    this.invincible = false;
    this.glowIntensity = 0;
  }
  update(dt) {
    // 跟随鼠标
    this.targetX = input.active ? input.x : W / 2;
    this.targetY = input.active ? input.y : H / 2;

    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const d = Math.hypot(dx, dy);

    if (d > 2) {
      const followSpeed = 6 + this.speed * 0.02;
      this.x += dx * Math.min(1, followSpeed * dt);
      this.y += dy * Math.min(1, followSpeed * dt);
      this.angle = Math.atan2(dy, dx);
      this.speed = Math.min(this.maxSpeed, d / dt * 0.6);
    } else {
      this.speed = lerp(this.speed, 0, dt * 4);
    }

    // 限制在画布内（带边距）
    this.x = clamp(this.x, this.size, W - this.size);
    this.y = clamp(this.y, this.size, H - this.size);

    // 拖尾
    this.trail.unshift({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.pop();

    // 发光动画
    this.glowIntensity = 0.6 + 0.4 * Math.sin(performance.now() * 0.003);

    // 计时器
    if (this.shieldActive) {
      this.shieldTimer -= dt;
      if (this.shieldTimer <= 0) this.shieldActive = false;
    }
    if (this.magnetActive) {
      this.magnetTimer -= dt;
      if (this.magnetTimer <= 0) this.magnetActive = false;
    }
    if (this.invincible) {
      this.invincibleTimer -= dt;
      if (this.invincibleTimer <= 0) this.invincible = false;
    }
  }
  draw(ctx) {
    // 拖尾
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const a = 1 - (i / this.trail.length);
      const s = this.size * (0.15 + 0.85 * (1 - i / this.trail.length));
      ctx.beginPath();
      ctx.arc(t.x, t.y, s * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue + i * 3}, 100%, 70%, ${a * 0.25})`;
      ctx.fill();
    }

    const px = this.x, py = this.y, s = this.size, a = this.angle;

    // 外发光（大光圈）
    const gradGlow = ctx.createRadialGradient(px, py, 0, px, py, s * 5);
    gradGlow.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${0.15 * this.glowIntensity})`);
    gradGlow.addColorStop(0.4, `hsla(${this.hue + 30}, 100%, 60%, ${0.08 * this.glowIntensity})`);
    gradGlow.addColorStop(1, 'hsla(0,0%,100%,0)');
    ctx.beginPath();
    ctx.arc(px, py, s * 5, 0, Math.PI * 2);
    ctx.fillStyle = gradGlow;
    ctx.fill();

    // 护盾
    if (this.shieldActive) {
      ctx.beginPath();
      ctx.arc(px, py, s * 2.2, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(180, 100%, 70%, ${0.3 + 0.2 * Math.sin(performance.now() * 0.005)})`;
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 12]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 玩家本体（星芒形状）
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(a);

    // 主体 — 四芒星
    const pts = 4;
    for (let i = 0; i < pts * 2; i++) {
      const angle2 = (i / (pts * 2)) * Math.PI * 2 - Math.PI / 2;
      const r = i % 2 === 0 ? s : s * 0.35;
      const x = Math.cos(angle2) * r;
      const y = Math.sin(angle2) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();

    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
    grad.addColorStop(0, `hsla(${this.hue}, 100%, 90%, 1)`);
    grad.addColorStop(0.4, `hsla(${this.hue}, 100%, 70%, 0.9)`);
    grad.addColorStop(0.7, `hsla(${this.hue + 20}, 100%, 50%, 0.6)`);
    grad.addColorStop(1, `hsla(${this.hue + 40}, 100%, 40%, 0)`);
    ctx.fillStyle = grad;
    ctx.fill();

    // 中心光点
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    ctx.restore();

    // 粒子拖尾
    if (this.speed > 50) {
      emitTrail(px, py, `hsla(${this.hue}, 100%, 70%, 0.8)`, 1);
    }
  }
  getCollisionRadius() { return this.size * 0.5; }
  hasMagnet() { return this.magnetActive; }
  hasShield() { return this.shieldActive; }
  isInvincible() { return this.invincible; }
}

// ── 流光（收集物） ──
const orbs = [];
class Orb {
  constructor() {
    this.x = rand(40, W - 40);
    this.y = rand(40, H - 40);
    this.size = rand(7, 14);
    this.hue = rand(0, 360);
    this.speed = rand(0, 0);
    this.bobPhase = rand(0, Math.PI * 2);
    this.bobSpeed = rand(1, 3);
    this.bobAmount = rand(3, 8);
    this.life = 1;
    this.pulse = rand(0, Math.PI * 2);
    this.glowSize = this.size * 3;
    this.points = Math.floor(this.size / 3) + 2;
    this.sat = rand(60, 100);
    this.light = rand(55, 75);
  }
  update(dt, player) {
    this.bobPhase += this.bobSpeed * dt;
    this.pulse += dt * 2;

    // 磁力吸引
    if (player && player.hasMagnet()) {
      const dx = player.x - this.x;
      const dy = player.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d < 300 && d > 5) {
        const force = 200 / d;
        this.x += (dx / d) * force * dt * 60;
        this.y += (dy / d) * force * dt * 60;
      }
    }

    // 收集检测
    if (player) {
      const d = dist(this.x, this.y, player.x, player.y);
      if (d < this.size + player.getCollisionRadius() + 8) {
        this.life = 0;
        playCollect(660 + this.points * 40);
        emitExplosion(this.x, this.y, `hsla(${this.hue}, 100%, 70%, 1)`, 15, 4, 80);
        return this.points;
      }
    }
    return 0;
  }
  get bobY() { return this.y + Math.sin(this.bobPhase) * this.bobAmount; }
  draw(ctx) {
    if (this.life <= 0) return;
    const bx = this.x;
    const by = this.bobY;
    const pulseSize = 1 + 0.08 * Math.sin(this.pulse);
    const s = this.size * pulseSize;

    // 光环
    const grad = ctx.createRadialGradient(bx, by, 0, bx, by, s * 4);
    grad.addColorStop(0, `hsla(${this.hue}, ${this.sat}%, ${this.light}%, 0.2)`);
    grad.addColorStop(0.5, `hsla(${this.hue}, ${this.sat}%, ${this.light}%, 0.08)`);
    grad.addColorStop(1, 'hsla(0,0%,100%,0)');
    ctx.beginPath();
    ctx.arc(bx, by, s * 4, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // 主体
    ctx.beginPath();
    ctx.arc(bx, by, s, 0, Math.PI * 2);
    const g2 = ctx.createRadialGradient(bx - s * 0.3, by - s * 0.3, 0, bx, by, s);
    g2.addColorStop(0, `hsla(${this.hue}, 100%, 90%, 1)`);
    g2.addColorStop(0.3, `hsla(${this.hue}, ${this.sat}%, ${this.light}%, 0.9)`);
    g2.addColorStop(1, `hsla(${this.hue}, ${this.sat}%, ${this.light}%, 0.3)`);
    ctx.fillStyle = g2;
    ctx.fill();

    // 高光
    ctx.beginPath();
    ctx.arc(bx - s * 0.25, by - s * 0.25, s * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();
  }
}

// ── 暗影（障碍物） ──
const obstacles = [];
class Obstacle {
  constructor(difficulty = 1) {
    const side = randInt(0, 3);
    if (side === 0) { this.x = rand(0, W); this.y = -30; }
    else if (side === 1) { this.x = W + 30; this.y = rand(0, H); }
    else if (side === 2) { this.x = rand(0, W); this.y = H + 30; }
    else { this.x = -30; this.y = rand(0, H); }

    this.size = rand(15, 30 + difficulty * 4);
    this.speed = rand(40, 80 + difficulty * 15);
    const dx = W / 2 - this.x;
    const dy = H / 2 - this.y;
    const d = Math.hypot(dx, dy) || 1;
    this.vx = (dx / d) * this.speed;
    this.vy = (dy / d) * this.speed;
    this.rotation = rand(0, Math.PI * 2);
    this.rotSpeed = rand(-2, 2);
    this.life = 1;
    this.hue = rand(260, 330);
    this.difficulty = difficulty;
    this.jaggedPoints = [];
    const ptCount = randInt(6, 12);
    for (let i = 0; i < ptCount; i++) {
      const a = (i / ptCount) * Math.PI * 2;
      const r = this.size * rand(0.6, 1.3);
      this.jaggedPoints.push({ a, r });
    }
  }
  update(dt, player) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rotation += this.rotSpeed * dt;

    // 超出屏幕移除
    if (this.x < -80 || this.x > W + 80 || this.y < -80 || this.y > H + 80) {
      this.life = 0;
      return 0;
    }

    // 碰撞检测
    if (player && !player.isInvincible()) {
      const d = dist(this.x, this.y, player.x, player.y);
      if (d < this.size * 0.7 + player.getCollisionRadius()) {
        if (player.hasShield()) {
          this.life = 0;
          playTone(300, 0.2, 'square', 0.06);
          emitExplosion(this.x, this.y, `hsla(${this.hue}, 100%, 50%, 1)`, 25, 5, 120);
          player.invincible = true;
          player.invincibleTimer = 0.5;
          return 0;
        }
        return -1; // 游戏结束
      }
    }
    return 0;
  }
  draw(ctx) {
    if (this.life <= 0) return;
    const { x, y } = this;

    // 暗影光环
    const grad = ctx.createRadialGradient(x, y, 0, x, y, this.size * 2.5);
    grad.addColorStop(0, `hsla(${this.hue}, 80%, 30%, 0.15)`);
    grad.addColorStop(0.6, `hsla(${this.hue}, 80%, 20%, 0.05)`);
    grad.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.beginPath();
    ctx.arc(x, y, this.size * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // 不规则形体
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(this.rotation);
    ctx.beginPath();
    for (let i = 0; i < this.jaggedPoints.length; i++) {
      const pt = this.jaggedPoints[i];
      const px = Math.cos(pt.a) * pt.r;
      const py = Math.sin(pt.a) * pt.r;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();

    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
    g2.addColorStop(0, `hsla(${this.hue}, 60%, 35%, 0.9)`);
    g2.addColorStop(0.5, `hsla(${this.hue}, 70%, 20%, 0.8)`);
    g2.addColorStop(1, `hsla(${this.hue}, 80%, 10%, 0.6)`);
    ctx.fillStyle = g2;
    ctx.fill();

    ctx.strokeStyle = `hsla(${this.hue}, 60%, 45%, 0.3)`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

// ── 能量道具 ──
const powerups = [];
class PowerUp {
  constructor(type) {
    this.x = rand(60, W - 60);
    this.y = rand(60, H - 60);
    this.size = 16;
    this.type = type; // 'magnet', 'shield', 'slow'
    this.life = 1;
    this.bobPhase = rand(0, Math.PI * 2);
    this.pulse = 0;
    this.rotation = 0;
    const colors = {
      magnet: { hue: 40, sat: 100, light: 60, label: '⚡ 磁力' },
      shield: { hue: 180, sat: 100, light: 60, label: '🛡 护盾' },
      slow:   { hue: 290, sat: 100, light: 65, label: '⏳ 时缓' },
    };
    this.style = colors[type] || colors.magnet;
  }
  update(dt, player) {
    this.bobPhase += dt * 2;
    this.pulse += dt * 3;
    this.rotation += dt * 1.5;

    if (player) {
      const d = dist(this.x, this.y, player.x, player.y);
      if (d < this.size + player.getCollisionRadius() + 10) {
        this.life = 0;
        playPowerUp();
        emitExplosion(this.x, this.y, `hsla(${this.style.hue}, 100%, 70%, 1)`, 30, 5, 100);
        return this.type;
      }
    }
    return null;
  }
  get bobY() { return this.y + Math.sin(this.bobPhase) * 5; }
  draw(ctx) {
    if (this.life <= 0) return;
    const bx = this.x;
    const by = this.bobY;
    const pulse = 1 + 0.1 * Math.sin(this.pulse);
    const s = this.size * pulse;

    // 光环
    const grad = ctx.createRadialGradient(bx, by, 0, bx, by, s * 5);
    grad.addColorStop(0, `hsla(${this.style.hue}, 100%, 70%, 0.15)`);
    grad.addColorStop(0.5, `hsla(${this.style.hue}, 100%, 60%, 0.05)`);
    grad.addColorStop(1, 'hsla(0,0%,100%,0)');
    ctx.beginPath();
    ctx.arc(bx, by, s * 5, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // 菱形主体
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(this.rotation);
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s, 0);
    ctx.lineTo(0, s);
    ctx.lineTo(-s, 0);
    ctx.closePath();

    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
    g2.addColorStop(0, '#fff');
    g2.addColorStop(0.3, `hsla(${this.style.hue}, 100%, 80%, 1)`);
    g2.addColorStop(0.7, `hsla(${this.style.hue}, ${this.style.sat}%, ${this.style.light}%, 0.8)`);
    g2.addColorStop(1, `hsla(${this.style.hue}, ${this.style.sat}%, ${this.style.light}%, 0.2)`);
    ctx.fillStyle = g2;
    ctx.fill();

    ctx.restore();

    // 小光点环绕
    for (let i = 0; i < 4; i++) {
      const a = this.rotation + (i / 4) * Math.PI * 2;
      const r = s * 1.5;
      const px = bx + Math.cos(a) * r;
      const py = by + Math.sin(a) * r;
      ctx.beginPath();
      ctx.arc(px, py, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.style.hue}, 100%, 80%, ${0.4 + 0.3 * Math.sin(this.pulse + i)})`;
      ctx.fill();
    }
  }
}

// ═══════════════════════════════════════════════════════════════
//  游戏主控制器
// ═══════════════════════════════════════════════════════════════

const GAME = {
  state: 'menu',  // menu | playing | gameover
  score: 0,
  highScore: parseInt(localStorage.getItem('stellarStream_highScore')) || 0,
  elapsed: 0,
  difficulty: 1,
  timeSlow: 1,
  slowTimer: 0,
  orbTimer: 0,
  orbInterval: 0.8,
  obstacleTimer: 0,
  obstacleInterval: 2.0,
  powerupTimer: 0,
  powerupInterval: 15,
  maxOrbs: 30,
  maxObstacles: 20,
  combo: 0,
  comboTimer: 0,

  starField: null,
  aurora: null,
  player: null,
  lastTime: 0,
};

function initGame() {
  GAME.score = 0;
  GAME.elapsed = 0;
  GAME.difficulty = 1;
  GAME.timeSlow = 1;
  GAME.slowTimer = 0;
  GAME.orbTimer = 0;
  GAME.orbInterval = 0.8;
  GAME.obstacleTimer = 0;
  GAME.obstacleInterval = 2.0;
  GAME.powerupTimer = 0;
  GAME.powerupInterval = 15;
  GAME.combo = 0;
  GAME.comboTimer = 0;
  GAME.maxOrbs = 30;
  GAME.maxObstacles = 20;

  GAME.starField = new StarField(220);
  GAME.aurora = new Aurora();
  GAME.player = new Player();
  orbs.length = 0;
  obstacles.length = 0;
  powerups.length = 0;
  particles.length = 0;

  // 初始流光
  for (let i = 0; i < 12; i++) {
    orbs.push(new Orb());
  }
}

function spawnOrb() {
  if (orbs.length >= GAME.maxOrbs) return;
  orbs.push(new Orb());
}

function spawnObstacle() {
  if (obstacles.length >= GAME.maxObstacles) return;
  obstacles.push(new Obstacle(GAME.difficulty));
}

function spawnPowerup() {
  const types = ['magnet', 'shield', 'slow'];
  const type = types[randInt(0, 2)];
  powerups.push(new PowerUp(type));
}

function applyPowerup(type) {
  const p = GAME.player;
  switch (type) {
    case 'magnet':
      p.magnetActive = true;
      p.magnetTimer = 6;
      showPowerupHint('⚡ 磁力吸引 · 6秒');
      break;
    case 'shield':
      p.shieldActive = true;
      p.shieldTimer = 5;
      showPowerupHint('🛡 能量护盾 · 5秒');
      break;
    case 'slow':
      GAME.timeSlow = 0.35;
      GAME.slowTimer = 4;
      showPowerupHint('⏳ 时空缓滞 · 4秒');
      break;
  }
}

let powerupHintTimeout = null;
function showPowerupHint(text) {
  powerupIndicator.textContent = text;
  powerupIndicator.style.opacity = 1;
  if (powerupHintTimeout) clearTimeout(powerupHintTimeout);
  powerupHintTimeout = setTimeout(() => {
    powerupIndicator.style.opacity = 0;
  }, 2500);
}

// ── 更新 ──
function update(dt) {
  if (GAME.state !== 'playing') {
    // 菜单时背景动画
    if (GAME.starField) {
      GAME.starField.update(dt, 0);
      GAME.aurora && GAME.aurora.update(dt);
    }
    // 更新粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update(dt);
      if (!particles[i].alive) particles.splice(i, 1);
    }
    return;
  }

  const p = GAME.player;
  if (!p) return;

  // 时缓
  const gameDt = dt * GAME.timeSlow;

  GAME.elapsed += gameDt;
  GAME.difficulty = 1 + GAME.elapsed * 0.04;
  GAME.comboTimer -= gameDt;
  if (GAME.comboTimer <= 0) GAME.combo = 0;

  // 时缓计时
  if (GAME.slowTimer > 0) {
    GAME.slowTimer -= gameDt;
    if (GAME.slowTimer <= 0) {
      GAME.timeSlow = 1;
      GAME.slowTimer = 0;
    }
  }

  // 更新星空 / 极光
  GAME.starField.update(dt, 0);
  GAME.aurora.update(dt);

  // 更新玩家
  p.update(gameDt);

  // 生成流光
  GAME.orbTimer -= gameDt;
  if (GAME.orbTimer <= 0) {
    spawnOrb();
    GAME.orbInterval = Math.max(0.2, 0.8 - GAME.elapsed * 0.005);
    GAME.orbTimer = GAME.orbInterval;
  }

  // 生成暗影
  GAME.obstacleTimer -= gameDt;
  if (GAME.obstacleTimer <= 0) {
    spawnObstacle();
    GAME.obstacleInterval = Math.max(0.4, 2.0 - GAME.elapsed * 0.008);
    GAME.obstacleTimer = GAME.obstacleInterval;
  }

  // 生成能量道具
  GAME.powerupTimer -= gameDt;
  if (GAME.powerupTimer <= 0) {
    if (powerups.length < 3) spawnPowerup();
    GAME.powerupInterval = Math.max(10, 15 - GAME.elapsed * 0.03);
    GAME.powerupTimer = GAME.powerupInterval;
  }

  // 更新流光
  for (let i = orbs.length - 1; i >= 0; i--) {
    const pts = orbs[i].update(gameDt, p);
    if (orbs[i].life <= 0) {
      if (pts > 0) {
        GAME.score += pts * (1 + GAME.combo * 0.1);
        GAME.combo++;
        GAME.comboTimer = 2;
      }
      orbs.splice(i, 1);
    }
  }

  // 更新暗影
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const result = obstacles[i].update(gameDt, p);
    if (obstacles[i].life <= 0) {
      obstacles.splice(i, 1);
      continue;
    }
    if (result === -1) {
      // 游戏结束
      gameOver();
      return;
    }
  }

  // 更新能量道具
  for (let i = powerups.length - 1; i >= 0; i--) {
    const type = powerups[i].update(gameDt, p);
    if (powerups[i].life <= 0) {
      if (type) applyPowerup(type);
      powerups.splice(i, 1);
    }
  }

  // 更新粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(gameDt);
    if (!particles[i].alive) particles.splice(i, 1);
  }

  // 更新 HUD
  scoreDisplay.textContent = Math.floor(GAME.score);
  highDisplay.textContent = GAME.highScore;

  // 控制提示淡出
  if (GAME.elapsed > 5) {
    controlsHint.classList.remove('show');
  }
}

// ── 绘制 ──
function draw() {
  ctx.clearRect(0, 0, W, H);

  // 背景
  const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.8);
  bgGrad.addColorStop(0, '#0d0a2e');
  bgGrad.addColorStop(0.5, '#08061e');
  bgGrad.addColorStop(1, '#020108');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 星空
  if (GAME.starField) GAME.starField.draw(ctx);

  // 极光
  if (GAME.aurora) GAME.aurora.draw(ctx);

  // 流光
  for (const o of orbs) o.draw(ctx);

  // 能量道具
  for (const p of powerups) p.draw(ctx);

  // 暗影
  for (const o of obstacles) o.draw(ctx);

  // 粒子
  for (const p of particles) p.draw(ctx);

  // 玩家
  if (GAME.player && GAME.state === 'playing') GAME.player.draw(ctx);
}

// ── 游戏结束 ──
function gameOver() {
  GAME.state = 'gameover';
  playGameOver();

  // 结束粒子爆发
  if (GAME.player) {
    emitExplosion(GAME.player.x, GAME.player.y, '#ff6b9d', 50, 6, 150);
    emitExplosion(GAME.player.x, GAME.player.y, '#60efff', 40, 4, 120);
    emitExplosion(GAME.player.x, GAME.player.y, '#ffd93d', 30, 3, 100);
  }

  const final = Math.floor(GAME.score);
  if (final > GAME.highScore) {
    GAME.highScore = final;
    localStorage.setItem('stellarStream_highScore', String(final));
  }

  finalScore.textContent = final;
  finalHigh.textContent = GAME.highScore;
  highDisplay.textContent = GAME.highScore;

  hudEl.classList.remove('show');
  controlsHint.classList.remove('show');
  powerupIndicator.style.opacity = 0;

  setTimeout(() => {
    gameoverScreen.classList.remove('hidden');
    gameoverScreen.classList.add('active');
  }, 400);
}

// ── 开始游戏 ──
function startGame() {
  initAudio();
  initGame();
  GAME.state = 'playing';
  menuScreen.classList.remove('active');
  menuScreen.classList.add('hidden');
  gameoverScreen.classList.remove('active');
  gameoverScreen.classList.add('hidden');
  hudEl.classList.add('show');
  controlsHint.classList.add('show');
  powerupIndicator.style.opacity = 0;
}

// ── 游戏循环 ──
function gameLoop(timestamp) {
  const dt = GAME.lastTime ? Math.min((timestamp - GAME.lastTime) / 1000, 0.05) : 0.016;
  GAME.lastTime = timestamp;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

// ── UI 事件绑定 ──
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('startBtn').addEventListener('touchend', e => {
  e.preventDefault();
  startGame();
});

document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('touchend', e => {
  e.preventDefault();
  startGame();
});

// 更新菜单最高分
menuHigh.textContent = GAME.highScore;

// ── 窗口自适应 ──
window.addEventListener('resize', () => {
  resize();
  if (GAME.starField) {
    for (const s of GAME.starField.stars) {
      if (s.x > W) s.x = rand(0, W);
      if (s.y > H) s.y = rand(0, H);
    }
  }
});

// ── 启动 ──
initGame();
requestAnimationFrame(gameLoop);
</script>
